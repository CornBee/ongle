<style>
  :root {
    --accent: #ff6b6b;
    --accent-2: #ffa8a8;
    --ink: #2b2b2b;
    --ink-soft: #555;
    --muted: #999;
    --rule: #ececec;
    --bg: #fff5f5;
    --surface: #fff;
    --up: #d63031;
    --down: #0984e3;
    --gain: #00b894;
    --loss: #d63031;
  }
  *, *:before, *:after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #000;
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    padding: 0;
  }

  #app {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    max-width: 540px;
    margin: 0 auto;
    background: #fff;
  }

  .screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }
  .screen.active { display: flex; }
  /* game·ending 화면은 페이지 스크롤 허용. cover·tutorial 은 viewport fit */
  #screen-cover.active, #screen-tutorial.active { min-height: 100vh; }

  /* ===== Cover — 벚꽃 흩날림 + 골든 hour, viewport fit ===== */
  #screen-cover {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 220, 180, 0.55) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 110%, rgba(255, 150, 180, 0.35) 0%, transparent 60%),
      linear-gradient(175deg, #ffd9a8 0%, #ffb3c8 50%, #d98ab3 100%);
    padding: 3vh 5vw;
    height: 100vh;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    text-align: center;
    user-select: none;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  /* 벚꽃 흩날림 — CSS only */
  .petal {
    position: absolute;
    top: -40px;
    width: 14px; height: 14px;
    background: linear-gradient(135deg, #ffd1de 0%, #ff9eb9 100%);
    border-radius: 100% 0 100% 100%;
    opacity: 0.85;
    pointer-events: none;
    z-index: 1;
    animation-name: petalFall;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    filter: drop-shadow(0 2px 4px rgba(220, 110, 150, 0.3));
  }
  @keyframes petalFall {
    0%   { transform: translate(0, 0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.9; }
    50%  { transform: translate(60px, 55vh) rotate(360deg); }
    100% { transform: translate(-30px, 110vh) rotate(720deg); opacity: 0; }
  }
  .cover-art {
    width: 32vh; height: 32vh;
    max-width: 240px; max-height: 240px;
    min-width: 150px; min-height: 150px;
    border-radius: 50%;
    background: linear-gradient(160deg, #fff5d4 0%, #ffd9a8 100%);
    margin: 2vh auto 2.5vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 5.4em;
    color: #d98ab3;
    overflow: hidden;
    border: 4px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      0 0 60px rgba(255, 180, 120, 0.55),
      0 14px 40px rgba(170, 60, 100, 0.35);
    position: relative;
    z-index: 2;
  }
  .cover-art img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: none;
  }
  .cover-art img.loaded { display: block; }
  .cover-art.has-image .cover-art-emoji { display: none; }
  .cover-title {
    font-size: 6.5vh;
    font-weight: 900;
    letter-spacing: -0.025em;
    color: #fff;
    margin: 0 0 0.25em;
    line-height: 1.0;
    position: relative; z-index: 2;
    text-shadow: 0 4px 28px rgba(170, 60, 100, 0.55), 0 2px 8px rgba(0,0,0,0.25);
  }
  .cover-title .accent {
    background: linear-gradient(180deg, #fff5d4 0%, #ffd093 50%, #ff8e3c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .cover-sub {
    color: rgba(255, 255, 255, 0.95);
    font-size: 2.2vh;
    font-weight: 500;
    margin: 0 auto 4vh;
    max-width: 88vw;
    line-height: 1.5;
    letter-spacing: -0.005em;
    position: relative; z-index: 2;
    text-shadow: 0 2px 12px rgba(170, 60, 100, 0.4);
  }
  .cover-sub .em {
    color: #fff5d4;
    font-weight: 700;
    text-shadow: 0 0 18px rgba(255, 220, 150, 0.7);
  }
  .cover-cta {
    background: linear-gradient(180deg, #fff5d4 0%, #ffba76 55%, #ff7aab 100%);
    color: #6b1a3a;
    font-size: 2.4vh;
    font-weight: 900;
    padding: 1.4vh 9vw;
    border-radius: 999px;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.65),
      0 14px 34px rgba(170, 60, 100, 0.55),
      0 4px 12px rgba(255, 180, 120, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.1s, box-shadow 0.15s;
    letter-spacing: 0.06em;
    position: relative; z-index: 2;
  }
  .cover-cta:active { transform: scale(0.97); }
  .cover-foot {
    margin-top: 2.5vh;
    font-size: 1.4vh;
    color: rgba(255, 255, 255, 0.7);
    position: relative; z-index: 2;
  }
  .cover-foot a { color: rgba(255, 255, 255, 0.88); text-decoration: none; }

  /* ===== Tutorial ===== */
  #screen-tutorial {
    background: linear-gradient(160deg, #fff5f5 0%, #ffe0e9 100%);
    padding: 2em 1.4em;
    justify-content: center;
    align-items: center;
  }
  .tut-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 1.8em 1.4em 1.4em;
    box-shadow: 0 8px 28px rgba(0,0,0,0.07);
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .tut-step {
    font-size: 0.78em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 0.3em;
    letter-spacing: 0.08em;
  }
  .tut-card h2 {
    margin: 0 0 0.7em;
    font-size: 1.35em;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .tut-card p {
    color: var(--ink-soft);
    font-size: 0.98em;
    margin: 0 0 0.6em;
    text-align: left;
  }
  .tut-card .icon {
    font-size: 3em;
    margin-bottom: 0.2em;
    display: block;
  }
  .tut-next {
    background: var(--accent);
    color: white;
    font-weight: 700;
    padding: 0.85em 2em;
    border-radius: 999px;
    margin-top: 1em;
    display: inline-block;
  }
  .tut-skip {
    display: block;
    margin: 0.8em auto 0;
    color: var(--muted);
    font-size: 0.85em;
    text-decoration: underline;
  }

  /* ===== Game ===== */
  #screen-game {
    background: #fff;
  }
  .game-header {
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    padding: 0.65em 0.9em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4em;
    border-bottom: 1px solid var(--rule);
    font-size: 0.85em;
    flex-shrink: 0;
    z-index: 5;
  }
  /* === Hamburger menu (fixed top-right — cover·game·ending 항상 표시) === */
  .menu-toggle {
    position: fixed;
    top: 0.8em; right: 0.8em;
    width: 46px; height: 46px;  /* 모바일 친화 44px+ */
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 224, 224, 0.6);
    font-size: 1.2em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    padding: 0;
    z-index: 250;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  }
  .menu-toggle:active { transform: scale(0.92); }
  .menu-dropdown {
    position: fixed;
    top: calc(0.8em + 46px + 0.4em);
    right: 0.8em;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.18);
    border: 1px solid var(--rule);
    padding: 0.4em;
    min-width: 210px;
    z-index: 251;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 0.15s, transform 0.15s;
  }
  .menu-dropdown.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.7em 0.9em;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--ink);
    font-size: 0.96em;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .menu-item:hover { background: #fff5f5; }
  .menu-item.danger { color: var(--accent); }
  .menu-item .icon { font-size: 1.1em; width: 22px; text-align: center; }
  .menu-item .state { margin-left: auto; font-size: 0.84em; color: var(--muted); font-weight: 600; }
  .menu-divider { height: 1px; background: var(--rule); margin: 0.3em 0; }

  /* Confirm dialog */
  .confirm-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.4em;
  }
  .confirm-backdrop.show { display: flex; }
  .confirm-box {
    background: #fff;
    border-radius: 16px;
    padding: 1.6em 1.4em 1.2em;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,0.3);
  }
  .confirm-title {
    font-size: 1.15em;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 0.3em;
  }
  .confirm-body {
    color: var(--ink-soft);
    font-size: 0.95em;
    line-height: 1.5;
    margin-bottom: 1.2em;
  }
  .confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5em;
  }
  .confirm-btn {
    padding: 0.85em;
    border-radius: 10px;
    font-weight: 700;
    border: none;
    font-size: 0.96em;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-btn.ghost { background: #f0f0f0; color: var(--ink); }
  .confirm-btn.primary { background: var(--accent); color: white; }
  .confirm-btn:active { transform: scale(0.97); }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 0.3em;
    background: #fff5f5;
    padding: 0.32em 0.65em;
    border-radius: 999px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .stat-pill.gain { background: #e8faf3; color: var(--gain); }
  .stat-pill.loss { background: #ffe9e9; color: var(--loss); }

  .affinity-bar {
    position: relative;
    height: 6px;
    background: #ffe0e0;
    border-radius: 999px;
    overflow: hidden;
    flex: 1;
    min-width: 40px;
  }
  .affinity-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.55s cubic-bezier(.34,1.56,.64,1);
    border-radius: 999px;
    position: relative;
  }
  .affinity-fill.pulse-up { animation: barFlashUp 0.7s ease; }
  .affinity-fill.pulse-down { animation: barFlashDown 0.7s ease; }
  @keyframes barFlashUp {
    0%   { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
    40%  { box-shadow: 0 0 14px 4px rgba(255, 107, 107, 0.9); }
    100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
  }
  @keyframes barFlashDown {
    0%   { box-shadow: 0 0 0 0 rgba(9, 132, 227, 0); }
    40%  { box-shadow: 0 0 14px 4px rgba(9, 132, 227, 0.9); }
    100% { box-shadow: 0 0 0 0 rgba(9, 132, 227, 0); }
  }
  .stat-pill.pulse-up { animation: pillBounce 0.55s ease; }
  .stat-pill.pulse-down { animation: pillShake 0.55s ease; }
  @keyframes pillBounce {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  @keyframes pillShake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-3px); }
    40%      { transform: translateX(3px); }
    60%      { transform: translateX(-2px); }
    80%      { transform: translateX(2px); }
  }

  /* === Affinity popup — 큰 숫자 떠오름 === */
  .aff-popup {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4.4em;
    font-weight: 900;
    letter-spacing: -0.04em;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .aff-popup.show { animation: affPopFloat 1.6s ease forwards; }
  .aff-popup.big  { font-size: 5.4em; }
  .aff-popup.huge { font-size: 6.4em; }
  .aff-popup.pos { color: #ff3b6b; }
  .aff-popup.huge.pos { color: #ffb300; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 4px 24px rgba(255, 100, 0, 0.5); }
  .aff-popup.neg { color: #0984e3; }
  .aff-popup.huge.neg { color: #2c3e50; text-shadow: 0 4px 24px rgba(9, 132, 227, 0.8); }
  @keyframes affPopFloat {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
    35%  { transform: translate(-50%, -52%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(0.92); }
  }

  /* === Screen flash + shake === */
  .scene-area.flash-up::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(255, 107, 107, 0.32) 0%, transparent 70%);
    z-index: 9; pointer-events: none;
    animation: flashFade 0.55s ease;
  }
  .scene-area.flash-down::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(9, 132, 227, 0.38) 0%, transparent 70%);
    z-index: 9; pointer-events: none;
    animation: flashFade 0.55s ease;
  }
  @keyframes flashFade {
    0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; }
  }
  .scene-area.shake { animation: sceneShake 0.4s ease; }
  @keyframes sceneShake {
    0%, 100% { transform: translateX(0); }
    15%      { transform: translateX(-8px); }
    30%      { transform: translateX(7px); }
    45%      { transform: translateX(-5px); }
    60%      { transform: translateX(4px); }
    75%      { transform: translateX(-2px); }
  }

  /* === Threshold confetti === */
  .confetti-burst {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 30;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    top: 40%; left: 50%;
    width: 10px; height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: confettiFly 1.7s ease forwards;
  }
  @keyframes confettiFly {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(0.5); }
    20%  { transform: translate(var(--dx), -120px) rotate(180deg) scale(1.1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.7); }
  }

  /* === Yuna portrait inset (dialog box 옆 — 표정 swap, 크게 박힘) === */
  .yuna-portrait {
    position: absolute;
    top: -90px;
    left: 0.9em;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    background: #fff5f5;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    z-index: 2;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5.4em;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), border-color 0.3s ease;
  }
  .yuna-portrait.bump { animation: portraitBump 0.45s ease; }
  @keyframes portraitBump {
    0%, 100% { transform: scale(1); }
    40%      { transform: scale(1.16); }
  }
  /* Reaction overlay — viewport 중앙 zoom·hold·fade out (별도 element) */
  .reaction-overlay {
    position: fixed;
    top: 50%; left: 50%;
    width: 240px; height: 240px;
    transform: translate(-50%, -50%) scale(0.3);
    border-radius: 50%;
    border: 5px solid var(--accent);
    background: #fff5f5;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7em;
  }
  .reaction-overlay img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .reaction-overlay.show {
    animation: reactionOverlayPop 1500ms cubic-bezier(.3,1.4,.4,1) forwards;
  }
  .reaction-overlay.show.big {
    animation: reactionOverlayPopBig 1700ms cubic-bezier(.3,1.4,.4,1) forwards;
    border-color: #ffd093;
    box-shadow: 0 24px 80px rgba(255,140,0,0.6);
  }
  .reaction-overlay.show.cold {
    animation: reactionOverlayPopCold 1500ms cubic-bezier(.3,1.4,.4,1) forwards;
    filter: grayscale(0.5) brightness(0.9);
    border-color: #6b7a8a;
    box-shadow: 0 24px 70px rgba(70,90,120,0.5);
  }
  @keyframes reactionOverlayPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    72%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
  }
  @keyframes reactionOverlayPopBig {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
    22%  { transform: translate(-50%, -50%) scale(1.1); }
    72%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  }
  @keyframes reactionOverlayPopCold {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25%  { transform: translate(-50%, -50%) scale(0.98); }
    72%  { opacity: 1; transform: translate(-50%, -50%) scale(0.98); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
  }
  @media (max-width: 380px) {
    .reaction-overlay { width: 200px; height: 200px; font-size: 6em; }
  }
  @media (max-width: 380px) {
    .yuna-portrait { width: 150px; height: 150px; top: -75px; font-size: 4.6em; }
  }
  .yuna-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: none;
  }
  .yuna-portrait.has-image img.loaded { display: block; }
  .yuna-portrait.has-image .yuna-portrait-emoji { display: none; }

  .scene-area {
    position: relative;
    flex: 0 0 auto;
    background: #ffe0d4;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    /* viewport 의 일정 비율로 박음. 너무 크면 dialog 아래로 밀려나옴 — 페이지 스크롤 OK */
    height: 55vh;
    min-height: 280px;
  }
  @media (min-height: 720px) { .scene-area { height: 60vh; } }
  .scene-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: opacity 0.4s;
  }
  .scene-bg-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8em;
    opacity: 0.25;
    pointer-events: none;
  }
  .character {
    position: relative;
    max-height: 90%;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .character-emoji {
    /* scene 일러스트 PNG 없을 때도 큰 emoji 표시 X — 배경만 보이게 */
    display: none;
  }
  .character-img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,0.18));
    display: none;
  }
  .character-img.loaded { display: block; }
  .character-img.loaded + .character-emoji,
  .character-emoji.hidden { display: none; }
  .character.has-image .character-emoji { display: none; }
  .scene-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: none;
    z-index: 0;
  }
  .scene-bg.has-image .scene-bg-img { display: block; }
  .scene-bg.has-image .scene-bg-icon { display: none; }
  .scene-badge {
    position: absolute;
    top: 0.7em;
    left: 0.7em;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    padding: 0.32em 0.8em;
    border-radius: 12px;
    font-size: 0.78em;
    font-weight: 700;
    color: var(--ink);
    z-index: 3;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .scene-badge .progress { color: var(--accent); margin-left: 0.4em; }

  .dialog-box {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-top: 3px solid var(--accent);
    padding: 5.4em 1.1em 1.4em;  /* portrait inset 자리 박음 (180px) */
    flex: 1 0 auto;
    /* max-height 폐기 — 자연 높이. 페이지 스크롤로 선택지 다 도달. */
  }
  .speaker {
    font-weight: 800;
    color: var(--accent);
    font-size: 0.98em;
    margin-bottom: 0.25em;
    letter-spacing: -0.01em;
  }
  .speaker.narrator { color: var(--muted); font-weight: 600; font-size: 0.85em; font-style: italic; }
  .dialog-text {
    font-size: 1em;
    color: var(--ink);
    margin: 0 0 0.3em;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.45em;
    margin-top: 0.7em;
  }
  .choice-btn {
    background: #fff5f5;
    border: 1.5px solid #ffd4d4;
    color: var(--ink);
    padding: 0.78em 0.95em;
    border-radius: 13px;
    font-size: 0.95em;
    font-weight: 600;
    text-align: left;
    transition: all 0.12s;
    line-height: 1.4;
    position: relative;
    z-index: 5;
  }
  .choice-btn:hover, .choice-btn:active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    transform: translateX(2px);
  }
  .next-btn {
    background: var(--accent);
    color: white;
    padding: 0.65em 1.4em;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.93em;
    margin-top: 0.5em;
    display: inline-block;
  }

  /* ===== Market decision — 트레이딩 dashboard 톤 (연애 분홍과 구분) ===== */
  .market-decision {
    background: linear-gradient(180deg, #1a1f2e 0%, #0e1320 100%);
    border-radius: 14px;
    margin-top: 0.6em;
    padding: 0.9em 0.9em 1em;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    color: #e8eaf2;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", monospace;
  }
  .market-decision .md-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(255,215,120,0.18);
    padding-bottom: 0.5em;
    margin-bottom: 0.6em;
  }
  .market-decision .md-symbol {
    font-size: 0.95em;
    font-weight: 800;
    color: #ffd093;
    letter-spacing: 0.1em;
  }
  .market-decision .md-price {
    display: flex; align-items: baseline; gap: 0.4em;
  }
  .market-decision .md-price .px {
    font-size: 1.7em;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
  }
  .market-decision .md-price .delta.up { color: #29d97c; font-weight: 700; }
  .market-decision .md-price .delta.down { color: #ff5a6b; font-weight: 700; }
  .market-decision .md-ctx {
    background: rgba(255,215,120,0.08);
    border-left: 3px solid #ffd093;
    padding: 0.55em 0.7em;
    border-radius: 6px;
    font-size: 0.85em;
    color: #cfd5e3;
    margin: 0.5em 0 0.7em;
    line-height: 1.5;
    font-family: inherit;
  }
  .market-decision .md-portfolio {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5em;
    margin-bottom: 0.7em;
  }
  .market-decision .md-portfolio .kpi {
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 0.5em 0.65em;
  }
  .market-decision .md-portfolio .kpi .lbl {
    font-size: 0.74em; color: #8b93a7; letter-spacing: 0.04em;
  }
  .market-decision .md-portfolio .kpi .val {
    font-size: 1.02em; font-weight: 700; color: #ffffff;
    margin-top: 0.15em;
  }
  .market-decision .md-options {
    display: flex;
    flex-direction: column;
    gap: 0.45em;
  }
  .md-option {
    background: linear-gradient(180deg, #2a2f44 0%, #1a1f30 100%);
    border: 1px solid rgba(255,215,120,0.25);
    border-radius: 10px;
    padding: 0.85em 0.95em;
    color: #e8eaf2;
    font-family: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    z-index: 5;
  }
  .md-option:hover, .md-option:active {
    background: linear-gradient(180deg, #ffd093 0%, #ffba76 100%);
    color: #1a1f2e;
    border-color: #ffd093;
    transform: translateX(2px);
  }
  .md-option .md-option-text {
    font-size: 0.94em;
    line-height: 1.35;
    display: block;
  }
  .md-option .md-option-hint {
    font-size: 0.74em;
    color: #8b93a7;
    margin-top: 0.25em;
    letter-spacing: 0.02em;
    font-family: inherit;
  }
  .md-option:hover .md-option-hint, .md-option:active .md-option-hint {
    color: #6b3a0f;
  }
  .md-option.tone-trust { border-color: rgba(41,217,124,0.3); }
  .md-option.tone-betray { border-color: rgba(255,90,107,0.3); }
  .md-option.tone-sacrifice { border-color: rgba(120,180,255,0.3); }
  .md-option.tone-trust:hover    { background: linear-gradient(180deg, #2adf85 0%, #1bb86c 100%); color: #fff; }
  .md-option.tone-betray:hover   { background: linear-gradient(180deg, #ff5a6b 0%, #d63a4b 100%); color: #fff; }
  .md-option.tone-sacrifice:hover{ background: linear-gradient(180deg, #78b4ff 0%, #4f8edc 100%); color: #fff; }

  /* ===== Market mini-game (legacy) ===== */
  .market-card {
    background: white;
    border-radius: 16px;
    margin-top: 0.8em;
    padding: 1em 1em 0.9em;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border: 1px solid #ffe0e0;
  }
  .market-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.3em;
  }
  .market-title {
    font-size: 0.92em;
    font-weight: 800;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 0.3em;
  }
  .market-date { font-size: 0.78em; color: var(--muted); }
  .market-price {
    display: flex;
    align-items: baseline;
    gap: 0.5em;
    margin-bottom: 0.3em;
  }
  .kospi-value {
    font-size: 1.6em;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .kospi-delta {
    font-size: 0.88em;
    font-weight: 700;
  }
  .kospi-delta.up { color: var(--up); }
  .kospi-delta.down { color: var(--down); }
  .market-context {
    background: #fafafa;
    border-left: 3px solid var(--accent-2);
    padding: 0.5em 0.7em;
    border-radius: 6px;
    font-size: 0.85em;
    color: var(--ink-soft);
    margin: 0.5em 0 0.7em;
    line-height: 1.5;
  }
  .position-summary {
    background: #fff5f5;
    border-radius: 10px;
    padding: 0.5em 0.8em;
    font-size: 0.86em;
    margin-bottom: 0.6em;
    display: flex;
    justify-content: space-between;
  }
  .position-summary .pos-label { color: var(--muted); }
  .position-summary .pos-value { font-weight: 700; }
  .trade-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.45em;
  }
  .trade-btn {
    padding: 0.78em 0.3em;
    border-radius: 11px;
    font-weight: 700;
    font-size: 0.92em;
    transition: transform 0.08s;
    line-height: 1.25;
    position: relative;
    z-index: 5;
  }
  .trade-btn small { font-size: 0.72em; font-weight: 500; display: block; opacity: 0.85; margin-top: 0.15em; }
  .trade-btn:active { transform: scale(0.96); }
  .trade-buy { background: var(--up); color: white; }
  .trade-sell { background: var(--down); color: white; }
  .trade-hold { background: #efefef; color: var(--ink); }
  .trade-buy:disabled, .trade-sell:disabled, .trade-hold:disabled {
    background: #ddd; color: #999; cursor: not-allowed;
  }

  /* ===== Ending ===== */
  #screen-ending {
    background: linear-gradient(160deg, #fff5f5 0%, #ffe0e9 100%);
    padding: 1.6em 1.2em;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-y: auto;
  }
  .ending-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 1.8em 1.3em 1.4em;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 14px 40px rgba(0,0,0,0.1);
  }
  .ending-mascot {
    font-size: 4.6em;
    margin-bottom: 0.1em;
    line-height: 1;
  }
  .ending-tag {
    display: inline-block;
    font-size: 0.76em;
    font-weight: 700;
    color: var(--accent);
    background: #ffe0e0;
    padding: 0.25em 0.85em;
    border-radius: 999px;
    margin: 0.4em 0 0.5em;
    letter-spacing: 0.08em;
  }
  .ending-title {
    font-size: 1.55em;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0.2em 0;
    line-height: 1.25;
  }
  .ending-body {
    color: var(--ink-soft);
    font-size: 0.97em;
    line-height: 1.65;
    margin: 0.7em 0 1.2em;
    text-align: left;
  }
  .ending-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5em;
    margin: 0.8em 0 1.2em;
  }
  .ending-stat {
    background: #fff5f5;
    border-radius: 13px;
    padding: 0.7em;
    border: 1.5px solid #ffd4d4;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    text-align: center;
  }
  .ending-stat:active { transform: scale(0.97); background: #ffe9e9; }
  .ending-stat .lbl { font-size: 0.74em; color: var(--muted); font-weight: 500; }
  .ending-stat .val { font-size: 1.35em; font-weight: 800; color: var(--ink); margin-top: 0.2em; }
  .ending-chart-wrap {
    margin: 0;
    text-align: left;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s ease, margin 0.3s ease;
  }
  .ending-chart-wrap.open {
    margin: 0.9em 0 0.4em;
    max-height: 260px;
  }
  .ending-chart-title {
    font-size: 0.86em;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 0.35em;
    padding-left: 0.2em;
    letter-spacing: -0.01em;
  }
  .ending-chart-box {
    background: #fff5f5;
    border-radius: 12px;
    padding: 0.5em 0.4em 0.3em;
    height: 180px;
    position: relative;
  }
  .ending-chart-box canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .ending-stat .percentile {
    font-size: 0.78em;
    color: var(--accent);
    font-weight: 700;
    margin-top: 0.25em;
  }
  .ending-cta {
    background: var(--accent);
    color: white;
    padding: 0.78em 1.7em;
    border-radius: 999px;
    font-weight: 700;
    margin: 0.2em 0.2em;
    font-size: 0.96em;
  }
  .ending-cta.ghost {
    background: white;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .ending-foot {
    margin-top: 1.2em;
    font-size: 0.8em;
    color: var(--muted);
  }
  .ending-foot a { color: var(--ink-soft); text-decoration: none; }

  /* ===== Toast ===== */
  .toast {
    position: absolute;
    top: 4em;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(43,43,43,0.94);
    color: white;
    padding: 0.55em 1em;
    border-radius: 999px;
    font-size: 0.86em;
    font-weight: 700;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, top 0.3s;
  }
  .toast.show { opacity: 1; top: 3.4em; }
  .toast.gain { background: var(--gain); }
  .toast.loss { background: var(--loss); }
  .toast.money-up { background: var(--up); }
  .toast.money-down { background: var(--down); }

  /* ===== Backgrounds ===== */
  .bg-office { background: linear-gradient(180deg, #e8f0ff 0%, #d4ddec 100%); }
  .bg-meeting { background: linear-gradient(180deg, #f5f0e8 0%, #e8e0d4 100%); }
  .bg-cafe { background: linear-gradient(180deg, #f4ead6 0%, #e8d8b8 100%); }
  .bg-pub { background: linear-gradient(180deg, #3a2a3a 0%, #5a4a5a 100%); }
  .bg-han { background: linear-gradient(180deg, #ffd4a0 0%, #ffb088 100%); }
  .bg-night { background: linear-gradient(180deg, #2a2a4a 0%, #4a3a5a 100%); }
  .bg-home { background: linear-gradient(180deg, #ffe0d4 0%, #ffd0bc 100%); }
  .bg-rooftop { background: linear-gradient(180deg, #87c0e8 0%, #b8d8f0 100%); }
  .bg-rain { background: linear-gradient(180deg, #708090 0%, #4a5a6a 100%); }

  @media (max-width: 380px) {
    .character-emoji { font-size: 11em; }
    .cover-title { font-size: 2em; }
    .kospi-value { font-size: 1.4em; }
  }
  @media (min-height: 760px) {
    .character-emoji { font-size: 15em; }
  }
</style>
</head>
<body>
<!-- Audio (graceful — wav/mp3 없으면 catch) -->
<audio id="bgm-audio" loop preload="none"></audio>
<audio id="narration-audio" preload="none"></audio>
<audio id="greeting-audio" preload="auto" src="voices/greeting.wav"></audio>

<!-- 햄버거 메뉴 (fixed top-right — cover·game·ending 항상 표시) -->
<button class="menu-toggle" onclick="game.toggleMenu(event)" aria-label="메뉴">
  <span>☰</span>
</button>
<div class="menu-dropdown" id="menu-dropdown">
  <button class="menu-item" onclick="game.toggleBgm()" id="menu-bgm">
    <span class="icon">🎵</span><span>BGM</span><span class="state" id="menu-bgm-state">켜짐</span>
  </button>
  <button class="menu-item" onclick="game.toggleVoice()" id="menu-voice">
    <span class="icon">🎤</span><span>음성</span><span class="state" id="menu-voice-state">켜짐</span>
  </button>
  <div class="menu-divider"></div>
  <button class="menu-item danger" onclick="game.confirmRestart()">
    <span class="icon">🏠</span><span>처음부터 다시</span>
  </button>
</div>

<!-- Portrait reaction overlay — 큰 zoom 시 viewport 중앙 표시 -->
<div class="reaction-overlay" id="reaction-overlay">
  <span class="reaction-overlay-emoji" id="reaction-overlay-emoji">🌸</span>
  <img id="reaction-overlay-img" alt="" style="display:none" />
</div>

<!-- Confirm dialog — destructive 액션 (홈 복귀 등) 박힌 자리 -->
<div class="confirm-backdrop" id="confirm-backdrop" onclick="game.confirmCancel(event)">
  <div class="confirm-box" onclick="event.stopPropagation()">
    <div class="confirm-title" id="confirm-title">처음부터 다시?</div>
    <div class="confirm-body" id="confirm-body">현재 진행 상황이 모두 사라집니다.</div>
    <div class="confirm-buttons">
      <button class="confirm-btn ghost" onclick="game.confirmCancel()">취소</button>
      <button class="confirm-btn primary" id="confirm-ok" onclick="game.confirmOk()">처음으로</button>
    </div>
  </div>
</div>

<div id="app">

  <!-- ===== Cover ===== -->
  <section id="screen-cover" class="screen active">
    <!-- 벚꽃 흩날림 (CSS animation) -->
    <span class="petal" style="left: 8%;  animation-duration: 11s; animation-delay: 0s;"></span>
    <span class="petal" style="left: 22%; animation-duration: 13s; animation-delay: 2s;  width: 11px; height: 11px;"></span>
    <span class="petal" style="left: 38%; animation-duration: 9s;  animation-delay: 4s;  width: 16px; height: 16px;"></span>
    <span class="petal" style="left: 54%; animation-duration: 14s; animation-delay: 1s;"></span>
    <span class="petal" style="left: 68%; animation-duration: 10s; animation-delay: 3s;  width: 12px; height: 12px;"></span>
    <span class="petal" style="left: 82%; animation-duration: 12s; animation-delay: 5s;"></span>
    <span class="petal" style="left: 92%; animation-duration: 15s; animation-delay: 0.5s; width: 10px; height: 10px;"></span>
    <span class="petal" style="left: 15%; animation-duration: 16s; animation-delay: 6s;  width: 13px; height: 13px;"></span>
    <span class="petal" style="left: 46%; animation-duration: 13s; animation-delay: 7s;  width: 11px; height: 11px;"></span>
    <span class="petal" style="left: 75%; animation-duration: 11s; animation-delay: 4.5s; width: 15px; height: 15px;"></span>

    <div class="cover-art" id="cover-art">
      <span class="cover-art-emoji">🌸</span>
      <img id="cover-art-img" alt="" />
    </div>
    <h1 class="cover-title"><span class="accent">유나</span>와의 봄</h1>
    <p class="cover-sub"><span class="em">그녀의 미소</span>일까, <span class="em">너의 통장</span>일까.<br/>둘 다 가질 수 있을까?</p>
    <button class="cover-cta" onclick="game.start()">시작하기</button>
    <div class="cover-foot">
      <a href="https://cornbee.github.io/ongle/" target="_blank">← ONGLE 메인</a>
    </div>
  </section>

  <script>
    // cover-art portrait swap — 이미 박힌 _01_yuna_face_default.png 있으면 swap (없으면 emoji)
    (function(){
      var el = document.getElementById('cover-art');
      var img = document.getElementById('cover-art-img');
      if (!el || !img) return;
      img.onload = function(){ el.classList.add('has-image'); img.classList.add('loaded'); };
      img.onerror = function(){ el.classList.remove('has-image'); img.removeAttribute('src'); };
      img.src = 'assets/_01_yuna_face_default.png';
    })();
  </script>

  <!-- ===== Tutorial ===== -->
  <section id="screen-tutorial" class="screen">
    <div class="tut-card">
      <div class="tut-step" id="tut-step-label">STEP 1 / 3</div>
      <div id="tut-content">
        <span class="icon">💬</span>
        <h2>대화로 호감도가 오릅니다</h2>
        <p>유나와의 대화에서 어떤 선택지를 고르냐에 따라 호감도가 변합니다.</p>
        <p>호감도가 일정 수준 넘어야 진엔딩에 도달합니다.</p>
      </div>
      <button class="tut-next" onclick="game.tutorialNext()">다음 →</button>
      <button class="tut-skip" onclick="game.skipTutorial()">건너뛰기</button>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section id="screen-game" class="screen">
    <header class="game-header">

const game = {

  tutIdx: 0,
  tutPages: [
    { icon: "💬", title: "대화로 호감도가 오릅니다", body: "유나와의 대화에서 어떤 선택지를 고르냐에 따라 호감도가 변합니다.\n호감도가 일정 수준 넘어야 진엔딩에 도달합니다." },
