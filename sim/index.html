  ],

  start() {
    // cover history entry 박음 — 뒤로가기 끝까지 가면 cover 복귀
    try {
      history.replaceState({ type: "cover" }, "", "#cover");
    } catch (e) {}
    try { gtag('event', 'sim_start', { event_category: 'sim' }); } catch (e) {}
    // GA4 custom — 커버 "시작하기" 클릭. funnel 시작점 측정용.
    try { gtag('event', 'sim_start_clicked'); } catch (e) {}
    // 첫 사용자 interaction — BGM autoplay (모바일 제약 해소) + greeting 동시 재생
    this.playBgm();
    this.playGreeting();
    this.beginChapter();
  },

  // (legacy — tutorial 페이지 호환용. 호출 안 됨)
  tutorialNext() { this.beginChapter(); },
  skipTutorial() { this.beginChapter(); },

  renderTut() {
    const p = this.tutPages[this.tutIdx];
    document.getElementById("tut-step-label").textContent = `STEP ${this.tutIdx + 1} / ${this.tutPages.length}`;
    document.getElementById("tut-content").innerHTML =
      `<span class="icon">${p.icon}</span><h2>${p.title}</h2>` +
      p.body.split("\n").map(x => `<p>${x}</p>`).join("");
  },

  beginChapter() {
    this.state = {
      sceneIdx: 0,
      affinity: GAME.start_affinity,
      cash: GAME.start_cash,
      kospi: GAME.start_kospi,
      kospi_start: GAME.start_kospi,
      shares: 0,
      avg_buy: 0,
      flags: {},
      timeline: [
        { idx: 0, aff: GAME.start_affinity, asset: GAME.start_cash, label: "시작", kind: "start" }
      ]
    };
    this.show("screen-game");
    // 게임 첫 scene marker — cover replaceState 위로 pushState 박음 (뒤로가기 시 cover 복귀)
    try {
      history.pushState({ type: "game", sceneIdx: 0, snap: JSON.parse(JSON.stringify(this.state)) }, "", "#s0");
    } catch (e) {}
    this.renderScene({ restoring: true });  // 이미 pushState 박았으므로 renderScene 안에서 다시 push 박지 X
  },

  // popstate (뒤로가기·앞으로가기) — 이전 scene state 복원
  restoreFromHistory(state) {
    if (!state || typeof state.sceneIdx !== "number" || !state.snap) return false;
    this.state = JSON.parse(JSON.stringify(state.snap));
    this.state.sceneIdx = state.sceneIdx;
    this.show("screen-game");
    this.renderScene({ restoring: true });
    return true;
  },

  renderScene(opts) {
    opts = opts || {};
    const s = this.state;
    let scene = CHAPTER_1[s.sceneIdx];
    if (!scene) { this.runEnding(); return; }

    // skip 처리 (MARKET 1 등)
    if (scene.skip_if && s.flags[scene.skip_if]) {
      s.sceneIdx++;
      this.renderScene(opts);
      return;
    }

    // affinity_gate — SCENE 20·21 고백 임계값. 호감도 < min 이면 alt scene 박음.
    // 박힘 정정: Object.assign 박으면 alt 박지 X 키 (choices·next 등) 가 원본 박힘 — narrative mismatch archetype.
    // 명시적 override 박음: alt 박힌 키만 박음, 그 외 (choices·next·market·market_choice) 는 alt 박지 X 면 undefined.
    if (scene.if_affinity_below && s.affinity < scene.if_affinity_below.min) {
      const alt = scene.if_affinity_below;
      scene = {
        bg: scene.bg, bgIcon: scene.bgIcon, label: scene.label,
        face: alt.face !== undefined ? alt.face : scene.face,
        speaker: alt.speaker !== undefined ? alt.speaker : scene.speaker,
        text: alt.text !== undefined ? alt.text : scene.text,
        choices: alt.choices,        // alt 박지 X 면 undefined (원본 choices 폐기)
        next: alt.next,              // alt 박지 X 면 undefined
        end: scene.end,
        market: alt.market,
        market_choice: alt.market_choice,
        _is_alt: true                // 분기 marker
      };
    }

    // History API — 뒤로가기 시 이전 scene 복원 가능. restoring 중에는 push X.
    if (!opts.restoring) {
      const snapshot = JSON.parse(JSON.stringify(s));  // deep clone
      const url = "#s" + s.sceneIdx;
      try {
        if (history.state && history.state.type === "game" && history.state.sceneIdx === s.sceneIdx) {
          history.replaceState({ type: "game", sceneIdx: s.sceneIdx, snap: snapshot }, "", url);
        } else {
          history.pushState({ type: "game", sceneIdx: s.sceneIdx, snap: snapshot }, "", url);
        }
      } catch (e) {}
    }

    // GA4 custom — scene_view (restoring 시에도 동일 scene 진입은 측정)
    try {
      gtag('event', 'scene_view', {
        scene_idx: s.sceneIdx,
        scene_name: scene.id || ('scene_' + String(s.sceneIdx).padStart(2, '0')),
        is_market: !!(scene.market_choice || scene.market)
      });
    } catch (e) {}

    // 배경 — gradient fallback + 일러스트 PNG swap (있으면)
    const bg = document.getElementById("scene-bg");
    bg.className = "scene-bg " + scene.bg;
    document.getElementById("scene-bg-icon").textContent = scene.bgIcon || "";

    const asset = ASSET_MAP[s.sceneIdx] || {};
    const bgImgEl = document.getElementById("scene-bg-img");
    if (asset.bg) {
      bgImgEl.onerror = () => { bg.classList.remove("has-image"); bgImgEl.removeAttribute("src"); };
      bgImgEl.onload = () => { bg.classList.add("has-image"); };
      bgImgEl.src = imgUrl(asset.bg);
    } else {
      bg.classList.remove("has-image");
      bgImgEl.removeAttribute("src");
    }

    // scene 라벨·progress
    document.getElementById("scene-label").textContent = scene.label || `SCENE ${s.sceneIdx + 1}`;
    document.getElementById("scene-progress").textContent = (s.sceneIdx + 1) + " / " + CHAPTER_1.length;

    // 캐릭터 — emoji fallback + 일러스트 PNG swap (있으면) + portrait 동기화
    document.getElementById("character-emoji").textContent = FACE[scene.face] || FACE.default;
    this.setPortrait(scene.face || "default");

    // BGM scene 별 switch
    this.switchBgmFor(scene, s.sceneIdx);

    // Voice narration — scene 진입 시 wav 재생 (없으면 graceful catch)
    this.playNarration(s.sceneIdx);
    const charEl = document.getElementById("character-display");
    const charImg = document.getElementById("character-img");
    if (asset.scene) {
      charImg.onerror = () => { charEl.classList.remove("has-image"); charImg.removeAttribute("src"); };
      charImg.onload = () => { charEl.classList.add("has-image"); };
      charImg.src = imgUrl(asset.scene);
    } else {
      charEl.classList.remove("has-image");
      charImg.removeAttribute("src");
    }

    // 헤더
    this.refreshHeader();

    // 대화
    document.getElementById("speaker").className = scene.speaker === "narrator" ? "speaker narrator" : "speaker";
    document.getElementById("speaker").textContent = scene.speaker === "narrator" ? "(나레이션)" : GAME.name;
    document.getElementById("dialog-text").textContent = scene.text;

    const choicesEl = document.getElementById("choices");
    const marketMount = document.getElementById("market-mount");
    choicesEl.innerHTML = "";
    marketMount.innerHTML = "";

    if (scene.market_choice) {
      // 새 디자인 — 도덕적 매매 분기 (aff + alloc + change 통합 선택지)
      this.renderMarketChoice(scene);
    } else if (scene.market) {
      this.renderMarketCard(scene);
    } else if (scene.choices) {
      scene.choices.forEach((c, i) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = c.text;
        btn.onclick = () => this.pickChoice(i);
        choicesEl.appendChild(btn);
      });
    } else if (scene.next) {
      const btn = document.createElement("button");
      btn.className = "next-btn";
      btn.textContent = scene.end ? "결말로 →" : "다음 →";
      btn.onclick = () => {
        if (scene.end) this.runEnding();
        else { s.sceneIdx++; this.renderScene(); }
      };
      choicesEl.appendChild(btn);
    }
  },

  renderMarketChoice(scene) {
    const s = this.state;
    const mc = scene.market_choice;
    const mount = document.getElementById("market-mount");

    // 트레이딩 dashboard — 검정·골드·green/red
    const card = document.createElement("div");
    card.className = "market-decision";
    const delta = (s.kospi - s.kospi_start) / s.kospi_start * 100;
    const deltaCls = delta >= 0 ? "up" : "down";
    const deltaTxt = (delta >= 0 ? "▲ +" : "▼ ") + Math.abs(delta).toFixed(1) + "%";
    card.innerHTML = `
      <div class="md-head">
        <span class="md-symbol">KOSPI</span>
        <span class="md-price">
          <span class="px">${this.fmt(s.kospi)}</span>
          <span class="delta ${deltaCls}">${deltaTxt}</span>
        </span>
      </div>
      <div class="md-ctx">${mc.ctx}</div>
      <div class="md-portfolio">
        <div class="kpi"><div class="lbl">CASH</div><div class="val">₩${this.fmt(Math.round(s.cash))}</div></div>
        <div class="kpi"><div class="lbl">HOLDINGS</div><div class="val">₩${this.fmt(Math.round(s.shares * s.kospi))}</div></div>
      </div>
      <div class="md-options" id="md-options"></div>
    `;
    mount.appendChild(card);

    // 선택지 박음 — 톤 분기 (trust·betray·sacrifice)
    const optsEl = card.querySelector("#md-options");
    mc.choices.forEach((c, i) => {
      let tone = "";
      const flag = (c.flag || "").toLowerCase();
      if (flag.includes("trust") || flag.includes("honest")) tone = "tone-trust";
      else if (flag.includes("betray") || flag.includes("alone") || flag.includes("sneaky")) tone = "tone-betray";
      else if (flag.includes("sacrifice") || flag.includes("help_yuna")) tone = "tone-sacrifice";

      // hint — alloc 박음. 호감도 음수 박지 X (예측 차단·서프라이즈)
      let hintParts = [];
      if (c.alloc > 0) hintParts.push("매수 " + Math.round(c.alloc * 100) + "%");
      else if (c.alloc < 0) hintParts.push("전량 매도");
      else hintParts.push("관망");
      if (c.aff > 0) hintParts.push("호감도 +" + c.aff);
      // 음수 박지 X — 사용자 예측 X·선택 후 reaction 으로만 reveal

      const btn = document.createElement("button");
      btn.className = "md-option " + tone;
      btn.innerHTML =
        '<span class="md-option-text">' + c.text + '</span>' +
        '<span class="md-option-hint">' + hintParts.join(" · ") + '</span>';
      btn.onclick = () => this.executeMarketChoice(i);
      optsEl.appendChild(btn);
    });

    // 기본 choices 영역 비워둠 (market-decision 안에 박힘)
    document.getElementById("choices").innerHTML = "";
  },

  executeMarketChoice(i) {
    const s = this.state;
    const scene = CHAPTER_1[s.sceneIdx];
    const mc = scene.market_choice;
    const choice = mc.choices[i];
    const affBefore = s.affinity;
    const totalBefore = s.cash + s.shares * s.kospi;

    // GA4 custom — choice_made (market choice)
    try {
      gtag('event', 'choice_made', {
        scene_idx: s.sceneIdx,
        choice_idx: i,
        choice_text: (choice.text || choice.label || '...').slice(0, 80),
        choice_type: 'market'
      });
    } catch (e) {}

    // 1) 자산 alloc 적용
    if (choice.alloc > 0) {
      // 매수: cash 의 alloc 비율
      const spend = Math.floor(s.cash * choice.alloc);
      if (spend > 0) {
        const newShares = spend / s.kospi;
        const total = s.shares + newShares;
        s.avg_buy = total > 0 ? (s.avg_buy * s.shares + s.kospi * newShares) / total : s.kospi;
        s.shares = total;
        s.cash -= spend;
      }
    } else if (choice.alloc < 0) {
      // 전량 매도 (자기희생)
      if (s.shares > 0.0001) {
        const receive = s.shares * s.kospi;
        s.cash += receive;
        s.shares = 0;
        s.avg_buy = 0;
      }
    }

    // 2) KOSPI 변동
    s.kospi = s.kospi * (1 + choice.change_pct / 100);

    // 3) 호감도 변동
    s.affinity = Math.max(0, Math.min(100, s.affinity + choice.aff));
    if (choice.flag) s.flags[choice.flag] = true;

    // 4) timeline 박음
    const totalAfter = Math.round(s.cash + s.shares * s.kospi);
    s.timeline.push({ idx: s.sceneIdx + 1, aff: s.affinity, asset: totalAfter, label: scene.label || "MARKET", kind: "market" });

    // 5) 도파민 효과 다 박음
    this.showAffPopup(choice.aff);
    this.vibeForAff(choice.aff);
    this.flashScene(choice.aff);
    this.pulseHeader(choice.aff);
    this.swapFaceForAff(choice.aff);
    if (choice.aff >= 15)       this.triggerPortraitReaction("big-pos");
    else if (choice.aff <= -10) this.triggerPortraitReaction("cold");
    else if (Math.abs(choice.aff) >= 5) this.triggerPortraitReaction("normal");
    this.checkThreshold(affBefore, s.affinity);

    // 자산 변동 toast
    const delta = (s.cash + s.shares * s.kospi) - totalBefore;
    const deltaPct = totalBefore > 0 ? (delta / totalBefore) * 100 : 0;
    if (Math.abs(delta) > 100000) {
      const txt = (delta >= 0 ? "🚀 +" : "💸 ") + this.fmt(Math.round(delta)) + "원 (" + (delta>=0?"+":"") + deltaPct.toFixed(1) + "%)";
      this.toast(txt, delta >= 0 ? "money-up" : "money-down");
      if (delta >= 0 && deltaPct >= 30) this.vibe([100,50,100,50,100]);
      else if (delta < 0) this.vibe([200,80,200]);
    }

    // 6) narrator dialog (선택 reply + 결과)
    document.getElementById("speaker").className = "speaker narrator";
    document.getElementById("speaker").textContent = "(시장 결과)";
    document.getElementById("dialog-text").textContent = choice.reply + "\n\nKOSPI: " + this.fmt(s.kospi) + " · 자산: " + this.fmt(totalAfter) + "원";
    document.getElementById("market-mount").innerHTML = "";

    // 7) next 버튼
    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    const btn = document.createElement("button");
    btn.className = "next-btn";
    btn.textContent = "다음 →";
    btn.onclick = () => { s.sceneIdx++; this.renderScene(); };
    choicesEl.appendChild(btn);

    this.refreshHeader();
  },

  renderMarketCard(scene) {
    const s = this.state;
    const mkt = scene.market;
    const mount = document.getElementById("market-mount");

    const card = document.createElement("div");
    card.className = "market-card";
    card.innerHTML = `
      <div class="market-head">
        <span class="market-title">📊 KOSPI</span>
        <span class="market-date">시장 결정</span>
      </div>
      <div class="market-price">
        <span class="kospi-value">${this.fmt(s.kospi)}</span>
        <span class="kospi-delta ${s.kospi >= s.kospi_start ? 'up' : 'down'}">${this.fmtPct((s.kospi - s.kospi_start) / s.kospi_start * 100)} (시작 대비)</span>
      </div>
      <div class="market-context">${mkt.ctx}</div>
      <div class="position-summary">
        <span><span class="pos-label">현금</span> <span class="pos-value">${this.fmt(Math.round(s.cash))}원</span></span>
        <span><span class="pos-label">보유 가치</span> <span class="pos-value">${this.fmt(Math.round(s.shares * s.kospi))}원</span></span>
      </div>
      <div class="trade-buttons">
        <button class="trade-btn trade-buy" data-act="buy">매수<small>현금 50%</small></button>
        <button class="trade-btn trade-hold" data-act="hold">홀드<small>유지</small></button>
        <button class="trade-btn trade-sell" data-act="sell">매도<small>전량</small></button>
      </div>
    `;
    mount.appendChild(card);
    card.querySelectorAll(".trade-btn").forEach(btn => {
      btn.onclick = () => this.executeTrade(btn.dataset.act, scene);
    });
  },

  executeTrade(action, scene) {
    const s = this.state;
    const mkt = scene.market;
    let msg = "";

    const totalBefore = s.cash + s.shares * s.kospi;
    if (action === "buy") {
      if (s.cash < 100000) { this.toast("현금 부족", "loss"); return; }
      const spend = Math.floor(s.cash * 0.50);
      const newShares = spend / s.kospi;
      const total = s.shares + newShares;
      s.avg_buy = total > 0 ? (s.avg_buy * s.shares + s.kospi * newShares) / total : 0;
      s.shares = total;
      s.cash -= spend;
      msg = "매수 체결: " + this.fmt(spend) + "원";
    } else if (action === "sell") {
      if (s.shares < 0.0001) { this.toast("보유 주식 없음", "loss"); return; }
      const receive = s.shares * s.kospi;
      const pnl = receive - s.avg_buy * s.shares;
      s.cash += receive;
      s.shares = 0;
      s.avg_buy = 0;
      msg = "매도 체결: " + this.fmt(Math.round(receive)) + "원 (손익 " + (pnl >= 0 ? "+" : "") + this.fmt(Math.round(pnl)) + ")";
    } else {
      msg = "홀드: 포지션 유지";
    }

    // 시장 변동 반영
    s.kospi = s.kospi * (1 + mkt.change_pct / 100);

    // timeline — 매매 후 자산 변동 (호감도는 그대로)
    const totalAfterTrade = Math.round(s.cash + s.shares * s.kospi);
    s.timeline.push({ idx: s.sceneIdx + 1, aff: s.affinity, asset: totalAfterTrade, label: (scene.label || "MARKET"), kind: "market" });

    // 도파민 toast — 매매 결과 자산 변동
    const totalAfter = s.cash + s.shares * s.kospi;
    const delta = totalAfter - totalBefore;
    const deltaPct = totalBefore > 0 ? (delta / totalBefore) * 100 : 0;
    let toastText, toastCls;
    if (delta > 100000) {
      toastText = "🚀 +" + this.fmt(Math.round(delta)) + "원 (" + deltaPct.toFixed(1) + "%)";
      toastCls = "money-up";
      // 진동 — 큰 수익
      if (deltaPct >= 30) this.vibe([100, 50, 100, 50, 100]);
      else if (deltaPct >= 10) this.vibe(60);
      else this.vibe(30);
    } else if (delta < -100000) {
      toastText = "💸 " + this.fmt(Math.round(delta)) + "원 (" + deltaPct.toFixed(1) + "%)";
      toastCls = "money-down";
      // 진동 — 큰 손실
      this.vibe([200, 80, 200]);
    } else {
      toastText = action === "hold" ? "📊 시장 통과" : "✓ 체결";
      toastCls = "gain";
    }
    this.toast(toastText, toastCls);

    // 결과 narrator
    document.getElementById("speaker").className = "speaker narrator";
    document.getElementById("speaker").textContent = "(시장 결과)";
    document.getElementById("dialog-text").textContent = msg + "\n\n" + mkt.post + "\n현재 KOSPI: " + this.fmt(s.kospi);
    document.getElementById("market-mount").innerHTML = "";

    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    const btn = document.createElement("button");
    btn.className = "next-btn";
    btn.textContent = "다음 →";
    btn.onclick = () => { s.sceneIdx++; this.renderScene(); };
    choicesEl.appendChild(btn);

    this.refreshHeader();
  },

  pickChoice(i) {
    const s = this.state;
    const sceneRaw = CHAPTER_1[s.sceneIdx];
    // affinity_gate 박힐 때 — alt.choices 박음 (alt.choices 박지 X 면 fallback 원본)
    const useAlt = sceneRaw.if_affinity_below && s.affinity < sceneRaw.if_affinity_below.min;
    const choiceList = useAlt
      ? (sceneRaw.if_affinity_below.choices || sceneRaw.choices)
      : sceneRaw.choices;
    if (!choiceList || !choiceList[i]) return;  // safety
    const choice = choiceList[i];
    const scene = sceneRaw;  // 원본 scene 박음 (label 등 reference)
    const affBefore = s.affinity;

    // GA4 custom — choice_made (dialog choice)
    try {
      gtag('event', 'choice_made', {
        scene_idx: s.sceneIdx,
        choice_idx: i,
        choice_text: (choice.text || choice.label || '...').slice(0, 80),
        choice_type: 'dialog'
      });
    } catch (e) {}

    s.affinity = Math.max(0, Math.min(100, s.affinity + choice.aff));
    if (choice.flag) s.flags[choice.flag] = true;

    // timeline 박음 — 호감도 변동
    const asset = Math.round(s.cash + s.shares * s.kospi);
    s.timeline.push({ idx: s.sceneIdx + 1, aff: s.affinity, asset: asset, label: scene.label || ("Scene " + (s.sceneIdx+1)), kind: "choice" });

    // ========== 도파민 효과 ==========
    // 1. 큰 popup
    this.showAffPopup(choice.aff);
    // 2. 진동 (Web Vibration API — iOS Safari graceful)
    this.vibeForAff(choice.aff);
    // 3. screen flash + shake
    this.flashScene(choice.aff);
    // 4. bar / pill pulse
    this.pulseHeader(choice.aff);
    // 5. 표정 portrait swap + reaction zoom
    this.swapFaceForAff(choice.aff);
    if (choice.aff >= 15)       this.triggerPortraitReaction("big-pos");
    else if (choice.aff <= -10) this.triggerPortraitReaction("cold");
    else if (Math.abs(choice.aff) >= 5) this.triggerPortraitReaction("normal");
    // 6. 임계값 도달 confetti
    this.checkThreshold(affBefore, s.affinity);

    // reply 보여주고 next 버튼
    // 박힘 정정: 원본 scene 의 speaker 가 narrator 면 narrator 톤 유지. reply 박지 X 면 빈 자리 X — narrator 박음.
    const isNarrator = sceneRaw.speaker === "narrator";
    const speakerEl = document.getElementById("speaker");
    speakerEl.className = isNarrator ? "speaker narrator" : "speaker";
    speakerEl.textContent = isNarrator ? "(나레이션)" : GAME.name;
    document.getElementById("dialog-text").textContent = choice.reply || "";
    this.playReplyVoice(s.sceneIdx, i);
    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";

    // special action (MARKET trigger)
    if (choice.action === "skip_market_1") {
      s.flags.boss_skip = true;
    }

    const btn = document.createElement("button");
    btn.className = "next-btn";
    btn.textContent = "다음 →";
    btn.onclick = () => { s.sceneIdx++; this.renderScene(); };
    choicesEl.appendChild(btn);

    this.refreshHeader();
  },

  refreshHeader() {
    const s = this.state;
    document.getElementById("stat-affinity").textContent = s.affinity;
    document.getElementById("affinity-fill").style.width = Math.max(0, Math.min(100, s.affinity)) + "%";
    const totalAsset = Math.round(s.cash + s.shares * s.kospi);
    document.getElementById("stat-asset").textContent = this.fmt(totalAsset);
    const pill = document.getElementById("stat-asset-pill");
    if (totalAsset > GAME.start_cash * 1.02) pill.className = "stat-pill gain";
    else if (totalAsset < GAME.start_cash * 0.98) pill.className = "stat-pill loss";
    else pill.className = "stat-pill";
  },

  runEnding() {
    const s = this.state;
    const finalAsset = s.cash + s.shares * s.kospi;
    const returnPct = (finalAsset - GAME.start_cash) / GAME.start_cash * 100;
    const aff = s.affinity;
    const confessYes = !!s.flags.confess_yes;
    const friendClose = !!s.flags.chapter_friend_close;  // 호감도 < 40 시 SCENE 20·21 alt 박힘

    // 엔딩 매트릭스 6종 (재설계 — 호감도·KOSPI 극단)
    // JACKPOT  : return ≥ 100 + aff < 40 (도파민 극치, 옆자리 X)
    // TRUE     : confess_yes + aff ≥ 60 + return ≥ 1
    // ROMANCE  : confess_yes + aff ≥ 40
    // BULL RUN : return ≥ 50 + aff < 40
    // FRIEND   : friend_close + aff ≥ 20  또는 confess_no/wait + aff ≥ 20
    // SOLO     : 그 외 (실패·자산 손실 포함)
    let ending;
    if (returnPct >= 100 && aff < 40) {
      ending = {
        tag: "JACKPOT ENDING",
        mascot: "🤑",
        title: "잭팟. 그리고 빈 자리.",
        body: "통장은 두 배로 부풀었다. 모니터 위 KOSPI 차트는 거의 수직. 동료들의 박수, 팀장의 어깨 두드림. 다만 — 옆자리는 비었다. 유나는 너의 결과에 박수를 보냈지만 그 박수는 거리감이 묻어 있다. 돈은 너의 손에 있고, 봄은 다른 사람의 것이 됐다."
      };
    } else if (confessYes && aff >= 60 && returnPct >= 1) {
      ending = {
        tag: "TRUE ENDING",
        mascot: "🥰",
        title: "유나와 봄, 그리고 첫 수익",
        body: "유나는 너의 손을 잡았다. KOSPI 차트도 너의 손을 들어주었다. 회사 안에서는 동료, 회사 밖에서는 연인. 다음 주 월요일 — 유나는 너에게 어머니 회사 IR에 같이 가달라고 했다. 완벽한 봄."
      };
    } else if (confessYes && aff >= 40) {
      ending = {
        tag: "ROMANCE ENDING",
        mascot: "🌸",
        title: returnPct >= 0 ? "수익은 작아도, 너를 얻었어" : "통장은 가벼워졌지만, 너는 옆에 있어",
        body: returnPct >= 0
          ? "수익은 크지 않지만 더 중요한 건 — 유나가 너의 옆에 있다는 것. 회사가 끝나고 같은 지하철을 타고 같은 카페에서 차를 마신다. 이 봄의 결말은 따뜻하다."
          : "통장은 가벼워졌지만 유나는 너의 손을 잡았다. \"돈은 또 벌면 되지. 너만 옆에 있으면 돼.\" 시장은 다음 주에도 열린다. 사랑은 지금 옆에 있다."
      };
    } else if (returnPct >= 50 && aff < 40) {
      ending = {
        tag: "BULL RUN ENDING",
        mascot: "📈",
        title: "수익은 챙겼지만, 옆자리는 비어",
        body: "통장은 50% 이상 두툼해졌다. 유나와는 회사 동료 거리에서 멈췄다. 회사 안에선 인사를 나누고, 회사 밖에선 보이지 않는다. 너는 자리에서 KOSPI 차트를 본다. 차트는 너를 배신하지 않았다. 다만 옆자리가 비었을 뿐."
      };
    } else if (aff >= 20 && (friendClose || s.flags.confess_no || s.flags.confess_wait)) {
      ending = {
        tag: "FRIEND ENDING",
        mascot: "☺️",
        title: "잘 지내는 두 사람",
        body: "고백은 일어나지 않았지만 유나와는 여전히 가까운 동료다. 다음 주 점심도 같이 먹기로 했다. 회사 안의 작은 봄은 조용히 이어진다. 조금 더 두고 봐도 좋은 사이."
      };
    } else if (finalAsset < GAME.start_cash * 0.8) {
      ending = {
        tag: "WIPED OUT",
        mascot: "💸",
        title: "통장도 봄도, 잃었다",
        body: "자산은 시작 시점의 80% 아래로 떨어졌다. 유나도 멀어졌다. 회사 점심 — 너는 혼자 편의점 김밥을 먹는다. KOSPI 차트는 무심하게 흘러간다. 다음 봄엔 다른 선택이 가능하다."
      };
    } else {
      ending = {
        tag: "SOLO ENDING",
        mascot: "😢",
        title: "잃은 봄",
        body: "유나는 멀어졌다. 회사 점심시간 — 너는 혼자 샌드위치를 먹는다. 봄은 짧고, 시장은 다음 주에도 열린다. 너는 다시 시작할 수 있다."
      };
    }

    document.getElementById("ending-tag").textContent = ending.tag;
    document.getElementById("ending-mascot").textContent = ending.mascot;
    document.getElementById("ending-title").textContent = ending.title;
    document.getElementById("ending-body").textContent = ending.body;
    document.getElementById("end-affinity").textContent = aff;
    document.getElementById("end-return").textContent = (returnPct >= 0 ? "+" : "") + returnPct.toFixed(1) + "%";
    document.getElementById("end-affinity-percentile").textContent = "상위 " + this.percentileForAffinity(aff) + "%";
    document.getElementById("end-return-percentile").textContent = "상위 " + this.percentileForReturn(returnPct) + "%";

    // 차트 wrap collapsed 상태로 시작 (다시 하기 후 재시작 대비)
    const wAff = document.getElementById("chart-wrap-affinity");
    const wAsset = document.getElementById("chart-wrap-asset");
    if (wAff) wAff.classList.remove("open");
    if (wAsset) wAsset.classList.remove("open");

    this.show("screen-ending");

    // 엔딩 도달 — BGM·narration 정지 (자동 stop)
    const bgmEl = document.getElementById("bgm-audio");
    const narrEl = document.getElementById("narration-audio");
    if (bgmEl) bgmEl.pause();
    if (narrEl) narrEl.pause();

    // 엔딩 진동 cue
    if (ending.tag === "TRUE ENDING") this.vibe([300, 100, 300, 100, 300]);
    else if (ending.tag === "JACKPOT ENDING") this.vibe([500, 100, 500]);
    else if (ending.tag === "ROMANCE ENDING") this.vibe([200, 100, 200]);
    else if (ending.tag === "BULL RUN ENDING") this.vibe([200, 100, 200]);
    else if (ending.tag === "FRIEND ENDING") this.vibe(150);
    else this.vibe(500);  // SOLO / WIPED — 무거운 한 번

    // 회고 차트 그리기 — Chart.js 로드된 후
    this.drawEndingCharts();

    try {
      gtag('event', 'sim_ending', {
        event_category: 'sim',
        event_label: ending.tag,
        value: Math.round(aff)
      });
    } catch (e) {}

    // GA4 custom — ending_reached (분포 측정용 상세 페이로드)
    try {
      const endingType = (ending.tag || '').replace(/\s*ENDING\s*$/i, '').trim();
      gtag('event', 'ending_reached', {
        ending_type: endingType,            // TRUE / ROMANCE / BULL RUN / FRIEND / JACKPOT / WIPED OUT / SOLO
        affection: Math.round(aff),
        return_pct: Math.round(returnPct * 10) / 10,
        affection_percentile: this.percentileForAffinity(aff),
        return_percentile: this.percentileForReturn(returnPct)
      });
      // 엔딩 도달 시점 — 추후 share 이벤트 결합용 캐시
      this._lastEndingType = endingType;
    } catch (e) {}
  },

  drawEndingCharts() {
    // Chart.js CDN 로드 대기 (네트워크 느릴 때 graceful retry)
    if (typeof Chart === "undefined") {
      if (!this._chartRetries) this._chartRetries = 0;
      if (this._chartRetries < 20) {
        this._chartRetries++;
        setTimeout(() => this.drawEndingCharts(), 250);
      }
      return;
    }
    this._chartRetries = 0;
    const tl = (this.state && this.state.timeline) || [];
    if (tl.length < 2) return;

    // 기존 차트 정리
    if (this._affChart) { this._affChart.destroy(); this._affChart = null; }
    if (this._assetChart) { this._assetChart.destroy(); this._assetChart = null; }

    const labels = tl.map((p, i) => i === 0 ? "시작" : ("S" + p.idx));
    const affs = tl.map(p => p.aff);
    const assets = tl.map(p => Math.round(p.asset / 10000));  // 만원 단위

    // MARKET 결정 지점 (kind === "market")
    const marketIdx = tl.map((p, i) => p.kind === "market" ? i : -1).filter(i => i >= 0);

    const baseOpts = {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 1200 },
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { ticks: { font: { size: 9 }, color: "#999", maxRotation: 0, autoSkip: true, autoSkipPadding: 8 }, grid: { display: false } },
        y: { ticks: { font: { size: 10 }, color: "#666" }, grid: { color: "#ffe0e0", lineWidth: 1 } }
      }
    };

    // 호감도 차트 — 임계값 40·60 가로선 + market 세로 marker
    const affCtx = document.getElementById("chart-affinity");
    if (affCtx) {
      // 임계값 선용 dataset (배경)
      const aff40 = labels.map(() => 40);
      const aff60 = labels.map(() => 60);
      this._affChart = new Chart(affCtx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "TRUE 임계 (60)",
              data: aff60,
              borderColor: "rgba(255, 107, 107, 0.35)",
              borderWidth: 1, borderDash: [4, 4],
              pointRadius: 0, fill: false
            },
            {
              label: "ROMANCE 임계 (40)",
              data: aff40,
              borderColor: "rgba(255, 168, 168, 0.5)",
              borderWidth: 1, borderDash: [4, 4],
              pointRadius: 0, fill: false
            },
            {
              label: "호감도",
              data: affs,
              borderColor: "#ff6b6b",
              backgroundColor: "rgba(255, 107, 107, 0.15)",
              borderWidth: 2.5, fill: true, tension: 0.25,
              pointRadius: (ctx) => marketIdx.includes(ctx.dataIndex) ? 4 : 2.5,
              pointBackgroundColor: (ctx) => marketIdx.includes(ctx.dataIndex) ? "#0984e3" : "#ff6b6b",
              pointBorderColor: "#fff",
              pointBorderWidth: 1.5
            }
          ]
        },
        options: Object.assign({}, baseOpts, {
          scales: {
            x: baseOpts.scales.x,
            y: Object.assign({}, baseOpts.scales.y, { min: 0, max: 100, ticks: Object.assign({}, baseOpts.scales.y.ticks, { stepSize: 20 }) })
          }
        })
      });
    }

    // 자산 차트 — 시작선 1000만 가로 marker + market 세로 marker
    const assetCtx = document.getElementById("chart-asset");
    if (assetCtx) {
      const startLine = labels.map(() => Math.round(GAME.start_cash / 10000));
      this._assetChart = new Chart(assetCtx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "시작 자산",
              data: startLine,
              borderColor: "rgba(150, 150, 150, 0.5)",
              borderWidth: 1, borderDash: [4, 4],
              pointRadius: 0, fill: false
            },
            {
              label: "자산 (만원)",
              data: assets,
              borderColor: "#00b894",
              backgroundColor: "rgba(0, 184, 148, 0.15)",
              borderWidth: 2.5, fill: true, tension: 0.15,
              pointRadius: (ctx) => marketIdx.includes(ctx.dataIndex) ? 5 : 2,
              pointBackgroundColor: (ctx) => marketIdx.includes(ctx.dataIndex) ? "#d63031" : "#00b894",
              pointBorderColor: "#fff",
              pointBorderWidth: 1.5
            }
          ]
        },
        options: Object.assign({}, baseOpts, {
          plugins: Object.assign({}, baseOpts.plugins, {
            tooltip: {
              callbacks: {
                label: (ctx) => ctx.dataset.label + ": " + ctx.parsed.y.toLocaleString("ko-KR") + "만원"
              }
            }
          })
        })
      });
    }
  },

  restart() {
    // GA4 custom — replay_started (엔딩 "다시 하기")
    try { gtag('event', 'replay_started', { source: 'ending_button' }); } catch (e) {}
    this.show("screen-cover");
  },

  toggleChart(kind) {
    const wrapId = kind === "affinity" ? "chart-wrap-affinity" : "chart-wrap-asset";
    const wrap = document.getElementById(wrapId);
    if (!wrap) return;
    const isOpen = wrap.classList.toggle("open");
    if (isOpen) {
      this.drawEndingCharts();  // 한 번만 그려도 safe (destroy 박혀 있음)
      setTimeout(() => { wrap.scrollIntoView({ behavior: "smooth", block: "center" }); }, 320);
      this.vibe(25);
    }
  },

  percentileForAffinity(aff) {
    if (aff >= 95) return 2;
    if (aff >= 85) return 5;
    if (aff >= 70) return 15;
    if (aff >= 55) return 30;
    if (aff >= 40) return 50;
    if (aff >= 25) return 70;
    if (aff >= 10) return 88;
    return 97;
  },
  percentileForReturn(pct) {
    if (pct >= 150) return 1;
    if (pct >= 100) return 3;
    if (pct >= 50) return 10;
    if (pct >= 20) return 25;
    if (pct >= 0) return 50;
    if (pct >= -20) return 70;
    if (pct >= -40) return 90;
    return 97;
  },

  share() {
    const s = this.state;
    const finalAsset = s.cash + s.shares * s.kospi;
    const returnPct = (finalAsset - GAME.start_cash) / GAME.start_cash * 100;
    const aff = s.affinity;
    const affPctile = this.percentileForAffinity(aff);
    const retPctile = this.percentileForReturn(returnPct);

    // GA4 custom — sim_share_clicked
    try {
      gtag('event', 'sim_share_clicked', {
        ending_type: this._lastEndingType || 'UNKNOWN'
      });
    } catch (e) {}

    // 엔딩 emoji prefix
    let prefix = "";
    if (returnPct >= 100 && aff < 40)            prefix = "🤑 JACKPOT · ";
    else if (s.flags.confess_yes && aff >= 60 && returnPct >= 1) prefix = "🥰 TRUE ENDING · ";
    else if (s.flags.confess_yes && aff >= 40)   prefix = "🌸 ROMANCE · ";
    else if (returnPct >= 50 && aff < 40)        prefix = "📈 BULL RUN · ";
    else if (aff >= 20 && (s.flags.chapter_friend_close || s.flags.confess_no || s.flags.confess_wait)) prefix = "☺️ FRIEND · ";
    else if (finalAsset < GAME.start_cash * 0.8) prefix = "💸 WIPED OUT · ";
    else                                          prefix = "😢 SOLO · ";

    const text = `${prefix}호감도 ${aff} (상위 ${affPctile}%) · 수익률 ${returnPct >= 0 ? "+" : ""}${returnPct.toFixed(1)}% (상위 ${retPctile}%) — ONGLE 미연시 투자 시뮬`;
    const url = "https://cornbee.github.io/ongle/sim/";

    if (navigator.share) {
      // text 안 URL 박지 X — url field 박힘. 중복 회피.
      navigator.share({ title: "유나와의 봄", text: text, url: url }).catch(()=>{});
    } else if (navigator.clipboard) {
      // clipboard fallback — text + url 박음 (한 번만)
      navigator.clipboard.writeText(text + "\n" + url);
      this.toast("결과 복사됨", "gain");
    }
  },

  show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  },

  toast(text, cls) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.className = "toast show " + (cls || "");
    setTimeout(() => { t.classList.remove("show"); }, 1600);
  },

  // ========== 도파민 도구 박음 ==========
  vibe(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  },
  vibeForAff(aff) {
    if (aff >= 20) this.vibe([60, 30, 60]);
    else if (aff >= 15) this.vibe(60);
    else if (aff >= 10) this.vibe(40);
    else if (aff >= 5)  this.vibe(25);
    else if (aff >= 2)  this.vibe(15);
    else if (aff <= -15) this.vibe([100, 60, 100, 60, 100]);
    else if (aff <= -10) this.vibe([80, 50, 80]);
    else if (aff <= -5)  this.vibe([60, 40, 60]);
  },
  showAffPopup(aff) {
    // 음수 변동 popup 박지 X — 표정·reaction·진동·screen flash 만으로 reveal.
    if (aff <= 0) return;
    const p = document.getElementById("aff-popup");
    if (!p) return;
    const absV = aff;
    let cls = "pos";
    if (absV >= 15) cls += " huge";
    else if (absV >= 8) cls += " big";
    p.textContent = "+" + aff;
    p.className = "aff-popup";
    void p.offsetWidth;
    p.className = "aff-popup show " + cls;
  },
  flashScene(aff) {
    const area = document.getElementById("scene-area");
    if (!area) return;
    const absV = Math.abs(aff);
    area.classList.remove("flash-up","flash-down","shake");
    void area.offsetWidth;
    if (aff >= 8) area.classList.add("flash-up");
    else if (aff <= -8) { area.classList.add("flash-down","shake"); }
    else if (aff <= -3) area.classList.add("shake");
  },
  pulseHeader(aff) {
    const fill = document.getElementById("affinity-fill");
    const pill = fill && fill.closest(".game-header") ? fill.closest(".game-header").querySelector(".stat-pill") : document.querySelector(".game-header .stat-pill");
    [fill, pill].forEach(el => {
      if (!el) return;
      el.classList.remove("pulse-up","pulse-down");
      void el.offsetWidth;
      el.classList.add(aff >= 0 ? "pulse-up" : "pulse-down");
    });
  },
  swapFaceForAff(aff) {
    // 호감도 변동 → 표정 매핑 (9 단계). 큰 - 시 경멸·분노·울먹 박음 — 도덕 딜레마 톤.
    let face;
    if (aff >= 15)       face = "love_heart";    // 폭증 — 하트 눈
    else if (aff >= 10)  face = "happy";         // 큰 +
    else if (aff >= 5)   face = "smile";         // 좋음
    else if (aff >= 1)   face = "default";       // 평이
    else if (aff >= -3)  face = "flustered";     // 살짝 당황
    else if (aff >= -8)  face = "disappointed";  // 실망
    else if (aff >= -15) face = "contempt_cold"; // 경멸·차가운 눈
    else if (aff >= -25) face = "angry";         // 분노
    else                 face = "crying";        // 폭락·배신
    this.setPortrait(face);
  },
  setPortrait(faceKey) {
    const emoji = (typeof FACE !== "undefined" && FACE[faceKey]) || "🌸";
    const portrait = document.getElementById("yuna-portrait");
    const e = document.getElementById("yuna-portrait-emoji");
    const img = document.getElementById("yuna-portrait-img");
    if (!portrait) return;
    if (e) e.textContent = emoji;
    // 일러스트 PNG 박혔으면 (yuna_face_<key>.png) swap, 없으면 emoji
    if (img) {
      img.onerror = () => { portrait.classList.remove("has-image"); img.removeAttribute("src"); img.classList.remove("loaded"); };
      img.onload = () => { portrait.classList.add("has-image"); img.classList.add("loaded"); };
      // 매핑 — character_bible_yuna.md 의 face key → 일러스트 파일명
      const fileMap = {
        default:       "_01_yuna_face_default",
        smile:         "_02_yuna_face_smile",
        surprise:      "_03_yuna_face_surprise",
        embarrassed:   "_04_yuna_face_embarrassed",
        sad:           "_05_yuna_face_aversion",
        happy:         "_02_yuna_face_smile",
        thinking:      "_01_yuna_face_default",
        worry:         "_05_yuna_face_aversion",
        serious:       "_01_yuna_face_default",
        blush:         "_04_yuna_face_embarrassed",
        laugh:         "_02_yuna_face_smile",
        // 확장 — 새 PNG 박힐 자리 (없으면 emoji fallback)
        love_heart:    "_06_yuna_face_love_heart",
        flustered:     "_04_yuna_face_embarrassed",  // PNG 없으면 embarrassed 재활용
        disappointed:  "_08_yuna_face_disappointed",
        contempt_cold: "_07_yuna_face_contempt",
        angry:         "_09_yuna_face_angry",
        crying:        "_10_yuna_face_crying"
      };
      const fileName = fileMap[faceKey] || "_01_yuna_face_default";
      img.src = "assets/" + fileName + ".png";
    }
    portrait.classList.remove("bump");
    void portrait.offsetWidth;
    portrait.classList.add("bump");
  },

  // Reaction overlay — viewport 중앙 큰 portrait zoom·hold·fade out
  triggerPortraitReaction(intensity) {
    const overlay = document.getElementById("reaction-overlay");
    if (!overlay) return;
    // 현재 portrait 박힌 표정 src 가져옴 (이미 swapped)
    const portraitImg = document.getElementById("yuna-portrait-img");
    const portraitEmoji = document.getElementById("yuna-portrait-emoji");
    const overlayImg = document.getElementById("reaction-overlay-img");
    const overlayEmoji = document.getElementById("reaction-overlay-emoji");
    if (portraitImg && portraitImg.src && portraitImg.classList.contains("loaded")) {
      overlayImg.src = portraitImg.src;
      overlayImg.style.display = "block";
      if (overlayEmoji) overlayEmoji.style.display = "none";
    } else {
      if (overlayImg) overlayImg.style.display = "none";
      if (overlayEmoji) {
        overlayEmoji.style.display = "block";
        overlayEmoji.textContent = portraitEmoji ? portraitEmoji.textContent : "🌸";
      }
    }
    overlay.classList.remove("show", "big", "cold");
    void overlay.offsetWidth;
    let cls = "show";
    let dur = 1500;
    if (intensity === "big-pos") { cls += " big"; dur = 1700; }
    else if (intensity === "cold") { cls += " cold"; dur = 1500; }
    overlay.className = "reaction-overlay " + cls;
    if (this._reactionTimer) clearTimeout(this._reactionTimer);
    this._reactionTimer = setTimeout(() => {
      overlay.classList.remove("show", "big", "cold");
    }, dur);
  },
  checkThreshold(before, after) {
    const s = this.state;
    if (!s._thresholdsHit) s._thresholdsHit = {};
    const ts = [40, 60, 80];
    ts.forEach(t => {
      if (before < t && after >= t && !s._thresholdsHit[t]) {
        s._thresholdsHit[t] = true;
        this.fireConfetti(t);
      }
    });
  },
  fireConfetti(level) {
    const burst = document.getElementById("confetti-burst");
    if (!burst) return;
    burst.innerHTML = "";
    const colors = level >= 80 ? ["#ff3b6b","#ffb300","#ff6b6b","#ffd93d","#ff8e3c"]
                 : level >= 60 ? ["#ff6b6b","#ffa8a8","#ff3b6b","#ffd93d"]
                                : ["#ff6b6b","#ffa8a8","#ffd4d4"];
    const count = level >= 80 ? 36 : level >= 60 ? 24 : 16;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const angle = (Math.random() * Math.PI * 2);
      const dist = 120 + Math.random() * 160;
      piece.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      piece.style.setProperty("--dy", Math.sin(angle) * dist + Math.abs(Math.sin(angle)) * 200 + "px");
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.2) + "s";
      burst.appendChild(piece);
    }
    // vibrate cue
    if (level >= 80) this.vibe([200, 100, 200, 100, 200]);
    else if (level >= 60) this.vibe([150, 80, 150]);
    else this.vibe([100, 50, 100]);
    // toast
    const msg = level >= 80 ? "🔥 80!" : level >= 60 ? "✨ 60" : "💖 40";
    this.toast(msg, "gain");
    setTimeout(() => { burst.innerHTML = ""; }, 2000);
  },

  // ========== Audio (BGM + voice 각각 독립 toggle) ==========
  bgmEnabled: true,
  voiceEnabled: true,
  bgmUrl: "audio/sim_chapter_romance.mp3",
  bgmTensionUrl: "audio/sim_chapter_tension.mp3",
  bgmClimaxUrl: "audio/sim_chapter_climax.mp3",

  playBgm(url) {
    if (!this.bgmEnabled) return;
    const bgm = document.getElementById("bgm-audio");
    if (!bgm) return;
    const target = url || this.bgmUrl;
    if (bgm.src && bgm.src.endsWith(target)) {
      if (bgm.paused) bgm.play().catch(()=>{});
      return;
    }
    bgm.src = target;
    bgm.volume = 0.32;
    bgm.play().catch(()=>{});
  },
  switchBgmFor(scene, sceneIdx) {
    if (!scene) return;
    if (scene.market_choice || scene.market) {
      this.playBgm(this.bgmTensionUrl);
    } else if (typeof sceneIdx === "number" && sceneIdx >= 17) {
      this.playBgm(this.bgmClimaxUrl);
    } else {
      this.playBgm(this.bgmUrl);
    }
  },
  playNarration(sceneIdx) {
    if (!this.voiceEnabled) return;
    const narr = document.getElementById("narration-audio");
    if (!narr) return;
    const id = String(sceneIdx).padStart(2, "0");
    narr.src = "voices/scene_" + id + ".wav";
    narr.volume = 0.92;
    narr.play().catch(()=>{});
  },
  playReplyVoice(sceneIdx, choiceIdx) {
    if (!this.voiceEnabled) return;
    const narr = document.getElementById("narration-audio");
    if (!narr) return;
    const id = String(sceneIdx).padStart(2, "0");
    narr.src = "voices/reply_" + id + "_" + choiceIdx + ".wav";
    narr.volume = 0.92;
    narr.play().catch(()=>{});
  },
  _greetingPlayed: false,
  playGreeting() {
    if (this._greetingPlayed) return;
    if (!this.voiceEnabled) { this._greetingPlayed = true; return; }
    const g = document.getElementById("greeting-audio");
    if (!g) return;
    g.volume = 0.95;
    const p = g.play();
    if (p && p.catch) {
      p.catch(() => {});
    }
    this._greetingPlayed = true;
  },
  toggleBgm() {
    this.bgmEnabled = !this.bgmEnabled;
    const bgm = document.getElementById("bgm-audio");
    const state = document.getElementById("menu-bgm-state");
    if (!this.bgmEnabled) {
      if (bgm) bgm.pause();
      if (state) state.textContent = "꺼짐";
    } else {
      if (state) state.textContent = "켜짐";
      this.playBgm();
    }
  },
  toggleVoice() {
    this.voiceEnabled = !this.voiceEnabled;
    const narr = document.getElementById("narration-audio");
    const state = document.getElementById("menu-voice-state");
    if (!this.voiceEnabled) {
      if (narr) narr.pause();
      if (state) state.textContent = "꺼짐";
    } else {
      if (state) state.textContent = "켜짐";
    }
  },
  toggleAudio() { this.toggleBgm(); },

  // 햄버거 메뉴 + confirm dialog
  toggleMenu(ev) {
    if (ev) ev.stopPropagation();
    const dd = document.getElementById("menu-dropdown");
    if (!dd) return;
    dd.classList.toggle("show");
    // 한 번만 박은 outside-click listener
    if (!this._menuClickListener) {
      this._menuClickListener = (e) => {
        const dd2 = document.getElementById("menu-dropdown");
        const tg = document.querySelector(".menu-toggle");
        if (!dd2) return;
        if (!dd2.contains(e.target) && tg && !tg.contains(e.target)) {
          dd2.classList.remove("show");
        }
      };
      document.addEventListener("click", this._menuClickListener);
    }
  },
  closeMenu() {
    const dd = document.getElementById("menu-dropdown");
    if (dd) dd.classList.remove("show");
  },
  confirmRestart() {
    this.closeMenu();
    const back = document.getElementById("confirm-backdrop");
    if (back) back.classList.add("show");
  },
  confirmCancel(ev) {
    if (ev && ev.target && !ev.target.classList.contains("confirm-backdrop")) {
      // backdrop click 만 cancel — 박스 안 click 은 event.stopPropagation 박힘
      if (ev.target.classList && ev.target.classList.contains("confirm-btn")) {
        // ghost cancel button — proceed
      } else if (ev.type) {
        return;
      }
    }
    const back = document.getElementById("confirm-backdrop");
    if (back) back.classList.remove("show");
  },
  confirmOk() {
    const back = document.getElementById("confirm-backdrop");
    if (back) back.classList.remove("show");
    // GA4 custom — replay_started (메뉴 → 홈)
    try { gtag('event', 'replay_started', { source: 'menu_home' }); } catch (e) {}
    // 홈 복귀 — cover state push (뒤로가기로 game scene 복원 차단)
    try {
      history.pushState({ type: "cover" }, "", "#cover");
    } catch (e) {}
    // BGM 정지 (cover 진입 시 자연)
    const bgm = document.getElementById("bgm-audio");
    if (bgm) bgm.pause();
    const narr = document.getElementById("narration-audio");
    if (narr) narr.pause();
    this.show("screen-cover");
  },

  fmt(n) { return Math.round(n).toLocaleString("ko-KR"); },
  fmtPct(p) { return (p >= 0 ? "+" : "") + p.toFixed(1) + "%"; }
};

window.game = game;

// Cover BGM + greeting autoplay
//  - 페이지 로드 즉시 play() 시도 (PWA standalone·이전 권한 부여 시 동작)
//  - 모바일 autoplay 차단 시 silent fallback — 첫 user gesture (click·touch·scroll·key) 시 시작
//  - 시각 hint 없음 (사용자 요청)
(function bootBgmAutoOrFirstGesture() {
  let booted = false;
  function tryBoot(triggerLabel) {
    if (booted) return;
    if (!window.game) {
      console.log("[BGM boot] game not ready yet — " + triggerLabel);
      return;
    }
    const bgm = document.getElementById("bgm-audio");
    if (!bgm) return;
    const wantBgm = !!window.game.bgmEnabled;
    let bgmPromise = null;
    if (wantBgm && bgm.paused) {
      try {
        bgmPromise = window.game.playBgm();
      } catch (e) {
        console.log("[BGM boot] playBgm error:", e.message);
      }
    }
    // greeting 같이 시도 (한 번만)
    try { window.game.playGreeting(); } catch (e) {}
    if (bgmPromise && bgmPromise.then) {
      bgmPromise.then(() => {
        booted = true;
        console.log("[BGM boot] autoplay success (" + triggerLabel + ")");
        detach();
      }).catch(err => {
        console.log("[BGM boot] autoplay rejected (" + triggerLabel + "):", err && err.message);
      });
    } else {
      // play() 동기 호출만 끝나도 booted 마킹 (gesture 경로)
      booted = true;
      detach();
    }
  }
  function onGesture() { tryBoot("gesture"); }
  function detach() {
    document.removeEventListener("click", onGesture);
    document.removeEventListener("touchstart", onGesture);
    document.removeEventListener("keydown", onGesture);
    document.removeEventListener("scroll", onGesture);
    window.removeEventListener("scroll", onGesture);
  }
  // (1) 즉시 시도 — DOM ready 직후
  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(() => tryBoot("immediate"), 50);
  } else {
    document.addEventListener("DOMContentLoaded", () => setTimeout(() => tryBoot("immediate"), 50));
  }
  // (2) silent fallback — 첫 user gesture
  document.addEventListener("click", onGesture, { passive: true });
  document.addEventListener("touchstart", onGesture, { passive: true });
  document.addEventListener("keydown", onGesture);
  document.addEventListener("scroll", onGesture, { passive: true });
  window.addEventListener("scroll", onGesture, { passive: true });
})();

// BGM auto-stop — 페이지 leave·hidden·엔딩 시 자동 정지
window.addEventListener("beforeunload", function() {
  const bgm = document.getElementById("bgm-audio");
  const narr = document.getElementById("narration-audio");
  if (bgm) bgm.pause();
  if (narr) narr.pause();
});
window.addEventListener("pagehide", function() {
  const bgm = document.getElementById("bgm-audio");
  const narr = document.getElementById("narration-audio");
  if (bgm) bgm.pause();
  if (narr) narr.pause();
});
document.addEventListener("visibilitychange", function() {
  const bgm = document.getElementById("bgm-audio");
  const narr = document.getElementById("narration-audio");
  if (document.hidden) {
    if (bgm) bgm.pause();
    if (narr) narr.pause();
  } else {
    // 다시 보임 — game 화면 진행 중이면 BGM 재생 (cover·ending 박힌 자리는 X)
    const isGame = document.getElementById("screen-game") && document.getElementById("screen-game").classList.contains("active");
    if (isGame && window.game && window.game.bgmEnabled) {
      try { window.game.playBgm(); } catch (e) {}
    }
  }
});

// 브라우저 뒤로가기 / 앞으로가기 — cover · game scene 복원
window.addEventListener("popstate", function(e) {
  if (!e.state) {
    // state 박힘 안 박힘 — 그냥 cover 박음 (가장 안전)
    game.show("screen-cover");
    return;
  }
  if (e.state.type === "cover") {
    game.show("screen-cover");
    return;
  }
  if (e.state.type === "game" && typeof e.state.sceneIdx === "number" && e.state.snap) {
    game.restoreFromHistory(e.state);
  }
});
</script>
