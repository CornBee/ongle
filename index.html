<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>락스타지망생 — 리포트</title>
<meta name="description" content="AI 보조로 정리한 산업분석·지정학·한국경제 리포트">
<meta property="og:title" content="락스타지망생 — 리포트">
<meta property="og:description" content="AI 보조로 정리한 산업분석·지정학·한국경제 리포트">
<style>
  :root {
    --accent: #ff6b35;
    --ink: #1a1a1a;
    --ink-soft: #444;
    --muted: #888;
    --rule: #ececec;
    --bg: #fafafa;
    --surface: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 3em 1.4em 2.4em;
    text-align: center;
  }
  .hero h1 {
    font-size: 2.2em;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.3em;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero p {
    color: var(--muted);
    font-size: 1.02em;
    max-width: 540px;
    margin: 0.3em auto 0;
  }
  .hero .yt {
    display: inline-block;
    margin-top: 1em;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9em;
    border-bottom: 1px dashed var(--rule);
    padding-bottom: 1px;
  }
  .filter-bar {
    max-width: 880px;
    margin: 1.6em auto 0;
    padding: 0 1.4em;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4em;
  }
  .cat-btn {
    background: var(--surface);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 0.4em 0.9em;
    border-radius: 999px;
    font-size: 0.86em;
    cursor: pointer;
    font-family: inherit;
  }
  .cat-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  main {
    max-width: 880px;
    margin: 1.4em auto 4em;
    padding: 0 1.4em;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.1em;
  }
  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1.4em 1.5em;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    border-color: #d8d8d8;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4em;
    align-items: center;
    margin-bottom: 0.6em;
  }
  .card-date { color: var(--muted); font-size: 0.83em; }
  .tag {
    display: inline-block;
    background: #f3f3f3;
    color: #555;
    padding: 0.12em 0.55em;
    border-radius: 999px;
    font-size: 0.78em;
  }
  .card-title {
    font-size: 1.18em;
    font-weight: 700;
    margin: 0.1em 0 0.4em;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .card-summary {
    color: var(--ink-soft);
    font-size: 0.94em;
    margin: 0;
  }
  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.9em;
    font-size: 0.86em;
  }
  .card-read { color: var(--accent); font-weight: 600; }
  .card-pdfs { display: inline-flex; gap: 0.4em; }
  .card-pdf {
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--rule);
    padding: 0.2em 0.6em;
    border-radius: 6px;
  }
  .card-pdf-mobile { color: #2c7a4d; border-color: #cfe5d8; }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 4em 1em;
    font-size: 0.95em;
  }
  footer {
    border-top: 1px solid var(--rule);
    padding: 2em 1em 3em;
    text-align: center;
    color: var(--muted);
    font-size: 0.84em;
    background: var(--surface);
    margin-top: 3em;
  }
  @media (max-width: 600px) {
    .hero { padding: 2.4em 1.2em 2em; }
    .hero h1 { font-size: 1.7em; }
    .card { padding: 1.1em 1.2em; }
  }
</style>
</head>
<body>
<header class="hero">
  <h1>락스타지망생 <span class="accent">·</span> 리포트</h1>
  <p>AI 보조로 정리한 산업분석·지정학·한국경제 리포트</p>
  <a class="yt" href="https://www.youtube.com/@락스타지망생" target="_blank" rel="noopener">YouTube 채널 →</a>
</header>
<div class="filter-bar">
  <button class="cat-btn active" data-cat="">전체</button>
  <button class="cat-btn" data-cat="산업분석">#산업분석</button><button class="cat-btn" data-cat="한국경제">#한국경제</button>
</div>
<main id="card-grid">
<a class="card" href="https://cornbee.github.io/ongle/r/070-전세대란" data-cats="산업분석,한국경제">
  <div class="card-meta">
    <span class="card-date">2026-05-10</span>
    <span class="tag">#산업분석</span> <span class="tag">#한국경제</span>
  </div>
  <h2 class="card-title">SGI서울보증 — 전세 대란 정책의 수혜 구조</h2>
  <p class="card-summary">어제(5월 9일) 4년간 미뤄졌던 다주택자 양도세 중과 유예가 종료됐습니다.</p>
  <div class="card-bottom">
    <span class="card-read">읽기 →</span>
    <span class="card-pdfs"><a class="card-pdf" href="https://cornbee.github.io/ongle/pdfs/ongle레포트_070_SGI서울보증-전세대란-수혜구조.pdf" target="_blank" rel="noopener">📄 PC</a> <a class="card-pdf card-pdf-mobile" href="https://cornbee.github.io/ongle/pdfs/ongle레포트_070_SGI서울보증-전세대란-수혜구조_mobile.pdf" target="_blank" rel="noopener">📱 모바일</a></span>
  </div>
</a>
</main>
<footer>
  © 락스타지망생 · 본 리포트는 영상 컨텐츠 보조 자료로 제작됐으며, 수치·인용은 모두 출처 링크로 검증 가능합니다.<br>
  마지막 업데이트: 2026-05-10 08:35
</footer>
<script>
  const buttons = document.querySelectorAll('.cat-btn');
  const cards = document.querySelectorAll('.card');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      cards.forEach(c => {
        const cs = (c.dataset.cats || '').split(',');
        c.style.display = (!cat || cs.includes(cat)) ? '' : 'none';
      });
    });
  });
</script>
</body>
</html>
